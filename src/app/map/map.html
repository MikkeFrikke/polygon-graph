<div class="layout">
  <div class="inputs-row">
    <div class="input-column">
      <label class="input-panel">
        <span class="input-label-row">
          <span class="input-label">Polygon coordinates (JSON array of [lat, lon] pairs)</span>
          @if (isDrawing) {
            <button type="button" class="draw-button" data-testid="draw-cancel" (click)="cancelDrawing()">
              Abbrechen
            </button>
          } @else {
            <button type="button" class="draw-button" data-testid="draw-start" (click)="startDrawing()">
              Neues Polygon
            </button>
          }
        </span>
        <textarea
          class="json-input"
          data-testid="json-input"
          rows="8"
          [(ngModel)]="jsonInput"
          (ngModelChange)="onInput()"
        ></textarea>
      </label>
      @if (errorMessage) {
        <p class="error-message" data-testid="error" role="alert">{{ errorMessage }}</p>
      }
    </div>
    <div class="input-column">
      <label class="input-panel">
        <span class="input-label">Standalone points (JSON array of [lat, lon] pairs)</span>
        <textarea
          class="json-input"
          data-testid="points-input"
          rows="8"
          [(ngModel)]="pointsInput"
          (ngModelChange)="onPointsInput()"
        ></textarea>
      </label>
      @if (pointsErrorMessage) {
        <p class="error-message" data-testid="points-error" role="alert">{{ pointsErrorMessage }}</p>
      }
    </div>
  </div>
  @if (isDrawing) {
    <div class="draw-controls">
      <span class="draw-hint" data-testid="draw-hint">
        Linksklick: Punkt hinzufügen · Rechtsklick: Polygon schliessen
      </span>
    </div>
  }
  <div #mapContainer class="map-container" data-testid="map"></div>
</div>
